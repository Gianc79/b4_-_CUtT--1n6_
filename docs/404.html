<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTTIMIZZAZIONE BARRE C.A. - Reindirizzamento...</title>
  <script>
    // Recupera il path corrente; se contiene /dist/ o altre sotto-cartelle, riporta alla base del repository
    var pathname = window.location.pathname;
    var segments = pathname.split('/').filter(Boolean);
    // Il nome del repository GitHub è segments[0] (es. 'b4_-_CUtT--1n6_')
    if (segments.length > 0 && segments[0] !== 'dist') {
      window.location.replace('/' + segments[0] + '/');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px; color: #102b46;">
  <h2>OTTIMIZZAZIONE BARRE C.A.</h2>
  <p>Reindirizzamento in corso...</p>
  <p><a href="./" style="color: #168b83; font-weight: bold;">Clicca qui se non vieni reindirizzato automaticamente</a></p>
</body>
</html>
