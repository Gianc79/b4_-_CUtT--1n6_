    <title>OTTIMIZZAZIONE BARRE C.A. — v. 1.25</title>
    <script>
      // Se ospitato su GitHub Pages con deploy statico da branch root (senza GitHub Actions attivo)
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var path = window.location.pathname;
          // Se siamo nella radice del repository su github.io e non siamo già dentro dist/ o docs/
          if (!path.includes('/dist') && !path.includes('/docs')) {
            var target = path.endsWith('/') ? path + 'dist/' : path + '/dist/';
            window.location.replace(target);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; color: #0f2942; padding: 20px;">
        <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #0284c7; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 18px; margin: 0 0 8px;">Caricamento OTTIMIZZAZIONE BARRE C.A...</h2>
        <p style="color: #64748b; font-size: 13px; max-width: 440px; margin: 0;">Caricamento dell'applicazione ottimizzata in corso.</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
